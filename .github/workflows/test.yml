name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      # Real Redis, not a mock: dispatch_queue.py's reordering relies on
      # actual WATCH/MULTI/EXEC semantics, which a mock can't stand in for
      # (see tests/test_dispatch_queue.py's docstring).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "redis>=5,<6" "requests>=2,<3"
      - run: python -m unittest discover -s tests -v
        env:
          REDIS_URL: redis://localhost:6379/0

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose.yaml interpolates its whole file up front, and
      # PANEL_API_TOKEN has a `${...:?}` required check even though nothing
      # about a *build* (as opposed to actually running the stack) needs a
      # real token -- a placeholder value is enough to get past that check.
      - name: Write a placeholder .env for build-time variable substitution
        run: |
          cp .env.example .env
          sed -i 's/^PANEL_API_TOKEN=.*/PANEL_API_TOKEN=ci-placeholder-token/' .env
      - run: docker compose build
      - run: docker compose --profile build build user-image
