name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      # Real Redis, not a mock: dispatch_queue.py's reordering relies on
      # actual WATCH/MULTI/EXEC semantics, which a mock can't stand in for
      # (see tests/test_dispatch_queue.py's docstring).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "redis>=5,<6"
      - run: python -m unittest discover -s tests -v
        env:
          REDIS_URL: redis://localhost:6379/0
